<style>
/* B.U.T. TOKYO 2026 — 공통 화면 스타일 (학생 · 관리자) */
:root {
  --paper: #F5F0E6;
  --paper-deep: #EBE3D3;
  --card: #FBF8F2;
  --ink: #23303F;
  --ink-soft: #5B6573;
  --line: #CFCABC;
  --accent: #C2432F;
  --accent-soft: #F3DDD6;
  --indigo: #2F4A6D;
  --sage: #A9AE9A;
  --ok: #3F7A52;
  --ok-soft: #DDEBDF;
  --warn: #B7791F;
  --warn-soft: #F6E7C8;
  --day: #C2432F;
  --radius: 16px;
  --shadow: 0 1px 2px rgba(35, 48, 63, .06), 0 6px 20px rgba(35, 48, 63, .07);
  --font: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --font-body: 'Gowun Batang', 'AppleMyungjo', 'Batang', serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--indigo); }
h1, h2, h3 { margin: 0; line-height: 1.3; letter-spacing: -0.01em; }
.label {
  font-size: 11px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.muted { color: var(--ink-soft); }
.hidden { display: none !important; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 44px;
  padding: 10px 18px;
  border-radius: 999px;
  border: 1px solid var(--ink);
  background: var(--ink);
  color: #fff;
  font-weight: 700;
  transition: transform .08s ease, opacity .15s;
}
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.accent { background: var(--accent); border-color: var(--accent); }
.btn.small { min-height: 34px; padding: 6px 12px; font-size: 14px; }
.btn.block { width: 100%; }

.field { display: block; margin: 0 0 18px; }
.field > .field-label {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  font-weight: 700;
  margin-bottom: 6px;
}
.field .hint { font-size: 13px; color: var(--ink-soft); font-weight: 400; }
.input, .textarea, .select {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
  font-size: 16px; /* iOS 확대 방지 */
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.textarea { min-height: 140px; resize: vertical; font-family: var(--font-body); line-height: 1.7; }
.input:focus, .textarea:focus, .select:focus { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(35, 48, 63, .1); }
.field.invalid .input, .field.invalid .textarea { border-color: var(--accent); }
.err { color: var(--accent); font-size: 13px; margin-top: 6px; min-height: 0; }
.counter { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.counter.bad { color: var(--accent); }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border: 1px solid currentColor;
  border-radius: 999px;
  font-size: 12px;
  line-height: 1.5;
}
.badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.no { background: var(--paper-deep); color: var(--ink-soft); }
.badge.accent { background: var(--accent-soft); color: var(--accent); }

.stamp {
  display: inline-grid;
  place-items: center;
  width: 46px;
  height: 46px;
  border: 2px solid var(--accent);
  border-radius: 50%;
  color: var(--accent);
  font-weight: 700;
  font-size: 20px;
  transform: rotate(-8deg);
  box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 4px var(--accent);
  background: var(--paper);
  flex: none;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(20px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  background: var(--ink);
  color: #fff;
  padding: 12px 18px;
  border-radius: 12px;
  font-size: 14px;
  z-index: 100;
  max-width: calc(100vw - 32px);
  box-shadow: var(--shadow);
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(35, 48, 63, .5);
  display: grid;
  place-items: center;
  z-index: 90;
  padding: 16px;
}
.dialog {
  background: var(--card);
  border-radius: 20px;
  padding: 24px;
  width: min(420px, 100%);
  box-shadow: var(--shadow);
}
.dialog h3 { margin-bottom: 8px; }
.dialog .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
.progress { height: 8px; background: var(--paper-deep); border-radius: 99px; overflow: hidden; margin: 14px 0 6px; }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px calc(120px + env(safe-area-inset-bottom)); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 0 12px; }
.brand b { display: block; font-size: 13px; letter-spacing: .18em; }
.brand span { font-size: 12px; color: var(--ink-soft); }
.hero { padding: 14px 0 18px; border-bottom: 1px solid var(--ink); margin-bottom: 18px; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.hero h1 { font-size: 28px; }
.hero p { margin: 6px 0 0; color: var(--ink-soft); font-size: 14px; }

/* 로그인 */
.login { padding: 22px; }
.login h2 { font-size: 20px; margin-bottom: 4px; }
.consent { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--ink-soft); background: var(--paper); border-radius: 12px; padding: 12px; margin-bottom: 16px; }
.consent input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); flex: none; }
.pin-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* 상단 학생 정보 + DAY 탭 */
.me { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.me strong { font-size: 18px; letter-spacing: .04em; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
.tab { border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 10px 4px 8px; text-align: center; line-height: 1.2; position: relative; }
.tab b { display: block; font-size: 15px; letter-spacing: .04em; }
.tab small { font-size: 11px; color: var(--ink-soft); }
.tab .dot { position: absolute; top: -6px; right: -4px; width: 18px; height: 18px; border: 2px solid var(--paper); border-radius: 50%; background: var(--ok); color: #fff; font-size: 10px; display: grid; place-items: center; }
.tab[aria-selected="true"] { background: var(--day); border-color: var(--day); color: #fff; }
.tab[aria-selected="true"] small { color: rgba(255,255,255,.85); }
.tab.locked { opacity: .55; }

/* 미션 카드 */
.mission { padding: 20px; margin-bottom: 16px; border-top: 6px solid var(--day); }
.mission .day-no { font-size: 46px; font-weight: 700; color: var(--day); line-height: 1; letter-spacing: -0.02em; }
.mission h2 { font-size: 21px; margin: 6px 0 2px; }
.mission .places { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 14px; color: var(--day); }
.mission ol { list-style: none; padding: 0; margin: 0 0 14px; }
.mission li { display: flex; gap: 10px; padding: 9px 0; border-top: 1px dashed var(--line); font-size: 15px; }
.mission li i { font-style: normal; font-weight: 700; color: var(--day); flex: none; }
.question { background: var(--paper); border-radius: 12px; padding: 12px 14px; font-family: var(--font-body); font-size: 15px; }
.question .label { display: block; margin-bottom: 4px; color: var(--day); }

.status-banner { padding: 14px 16px; margin-bottom: 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; background: var(--ok-soft); border-color: #bcd6c1; }
.status-banner.closed { background: var(--paper-deep); border-color: var(--line); }

/* 기록 폼 */
.form { padding: 20px; }
.form h3 { font-size: 17px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ph { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--paper-deep); }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph .rm { position: absolute; top: 4px; right: 4px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: rgba(35,48,63,.75); color: #fff; font-size: 16px; line-height: 1; }
.ph .st { position: absolute; left: 0; right: 0; bottom: 0; font-size: 11px; padding: 3px 6px; background: rgba(35,48,63,.65); color: #fff; }
.add-ph { aspect-ratio: 1; border: 1.5px dashed var(--sage); border-radius: 12px; background: transparent; display: grid; place-items: center; color: var(--ink-soft); font-size: 13px; line-height: 1.3; text-align: center; }
.add-ph b { font-size: 26px; display: block; color: var(--ink); font-weight: 400; }
.ph-meta { display: grid; gap: 8px; margin-top: 10px; }
.ph-meta .row { display: grid; grid-template-columns: 44px 1fr 92px; gap: 6px; align-items: center; }
.ph-meta .row img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; }
.ph-meta .input, .ph-meta .select { padding: 8px 10px; font-size: 16px; }

/* 전시 카드 미리보기 (예시 디자인) */
.preview-wrap { display: grid; grid-template-columns: 1fr 1.1fr; gap: 14px; align-items: center; margin-top: 4px; }
.pcard { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 10px 12px; }
.pcard .label { font-size: 8px; }
.pcard .d { font-weight: 700; font-size: 16px; margin: 1px 0 4px; }
.pcard .im { aspect-ratio: 4/3; border-radius: 9px; background: var(--paper-deep); overflow: hidden; }
.pcard .im img { width: 100%; height: 100%; object-fit: cover; }
.pcard .t { font-weight: 700; font-size: 14px; line-height: 1.35; margin: 8px 0 4px; min-height: 2.7em; word-break: keep-all; }
.pcard .m { font-size: 10px; color: var(--ink-soft); letter-spacing: .04em; }
.pcard .ln { height: 2px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-top: 6px; }

.submit-bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--paper) 70%, rgba(245,240,230,0)); z-index: 20; }
.submit-bar .inner { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
.submit-bar .saved { font-size: 12px; color: var(--ink-soft); white-space: nowrap; }

/* 완료 화면 */
.done { padding: 28px 22px; text-align: center; }
.done .stamp { width: 84px; height: 84px; font-size: 32px; margin: 4px auto 14px; }
.receipt { text-align: left; background: var(--paper); border-radius: 12px; padding: 14px 16px; margin: 16px 0; font-size: 14px; }
.receipt div { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; }
.receipt span { color: var(--ink-soft); }
footer.note { font-size: 12px; color: var(--ink-soft); text-align: center; margin: 26px 0 0; line-height: 1.6; }
</style>
</head>

<script>
/*
 * 서버 호출 어댑터: Apps Script에서는 google.script.run, 로컬 서버에서는 fetch('/api')
 * 네트워크 오류는 자동 재시도, 서버가 돌려준 오류(검증 실패 등)는 그대로 전달
 */
var BUT_API = (function () {
  var isGAS = typeof google !== 'undefined' && google.script && google.script.run;

  function once(action, payload) {
    return new Promise(function (resolve, reject) {
      if (isGAS) {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(function (err) { reject({ network: true, message: String(err && err.message || err) }); })
          .api(action, payload);
      } else {
        fetch('api', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: action, payload: payload }) })
          .then(function (r) { if (!r.ok && r.status >= 500) throw new Error('HTTP ' + r.status); return r.json(); })
          .then(resolve)
          .catch(function (e) { reject({ network: true, message: String(e && e.message || e) }); });
      }
    });
  }

  function call(action, payload, opts) {
    opts = opts || {};
    var tries = opts.retries === undefined ? 2 : opts.retries;
    function attempt(n) {
      return once(action, payload).then(function (res) {
        if (res && res.ok) return res.data;
        var err = (res && res.error) || { code: 'SERVER', message: '알 수 없는 오류' };
        throw err;
      }, function (netErr) {
        if (n < tries) return new Promise(function (r) { setTimeout(r, 1200 * Math.pow(2, n)); }).then(function () { return attempt(n + 1); });
        throw { code: 'NETWORK', message: '인터넷 연결이 불안정합니다. 와이파이/데이터를 확인하고 다시 시도해 주세요.', detail: netErr.message };
      });
    }
    return attempt(0);
  }

  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = (Math.random() * 16) | 0;
      return (c === 'x' ? r : (r & 0x3) | 0x8).toString(16);
    });
  }

  var store = {
    get: function (k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 저장 불가(사생활 보호 모드) */ } },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) { /* 무시 */ } }
  };

  function toast(msg, ms) {
    var t = document.createElement('div');
    t.className = 'toast';
    t.setAttribute('role', 'status');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, ms || 2600);
  }

  function esc(s) {
    return String(s === undefined || s === null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function fmtTime(isoStr) {
    if (!isoStr) return '';
    var d = new Date(isoStr);
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  return { call: call, uuid: uuid, store: store, toast: toast, esc: esc, fmtTime: fmtTime, isGAS: !!isGAS };
})();

</script>

    }

  }
  var saveTimer = null;
  function saveDraft(day) {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      var f = form(day);
      f.savedAt = new Date().toISOString();
      store.set(draftKey(day), { reflection: f.reflection, essay: f.essay, oneLine: f.oneLine, savedAt: f.savedAt });

      if (el) el.textContent = '임시저장 ' + BUT_API.fmtTime(f.savedAt).split(' ')[1];
    }, 500);
  }

  function setDayColor(n) {

  function pickDefaultDay(status, today) {
    var d = PROG.days.filter(function (x) { return x.date === today; })[0];

    var firstOpen = status.filter(function (s) { return s.state === 'open' && !s.submitted; })[0];
    return firstOpen ? firstOpen.day : 1;

  function handleError(e, fallback) {
    if (e && e.code === 'AUTH') { logout(true); toast(e.message); return; }

  // ------------------------------------------------------------ 로그인
  function renderLogin(msg) {

      '<p class="muted" style="margin:4px 0 18px;font-size:14px">선생님께 받은 학생 번호와 PIN을 입력하세요.</p>' +
      '<form id="loginForm" novalidate>' +
      '<div class="pin-row">' +
      '<label class="field"><span class="field-label">학생 번호</span><input class="input" id="sid" inputmode="numeric" autocomplete="username" placeholder="예: 07" maxlength="12" required></label>' +
      '<label class="field"><span class="field-label">PIN</span><input class="input" id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="숫자 4자리" maxlength="6" required></label>' +
      '</div>' +
      '<label class="consent"><input type="checkbox" id="agree"><span>제출한 사진과 글은 국외현장체험학습 결과물(포스터·기록지·팜플렛) 제작에 사용되며, 인솔 교사만 원본을 볼 수 있다는 안내를 읽었습니다.</span></label>' +
      '<div class="err" id="loginErr" role="alert">' + esc(msg || '') + '</div>' +
      '<button class="btn block accent" id="loginBtn" type="submit">기록 시작하기</button>' +
      '</form></section>';
    document.getElementById('loginForm').addEventListener('submit', function (ev) {
      ev.preventDefault();

      '<ol>' + d.missions.map(function (m, i) { return '<li><i>미션 ' + (i ? '②' : '①') + '</i><span>' + esc(m) + '</span></li>'; }).join('') + '</ol>' +

      '</section>';

      '<div class="im">' + (f.photos[0] ? '<img src="' + esc(f.photos[0].preview) + '" alt="">' : '') + '</div>' +
      '<div class="t" id="pv-one">' + esc(f.oneLine || d.sampleOneLine) + '</div><div class="m">' + esc(S.student.displayName) + ' / ' + d.dateLabel + '</div><div class="ln"></div></div>' +
      '<div class="muted" style="font-size:13px">첫 번째 사진과 한 줄 기록이 날짜별 포스터의 카드가 됩니다. 성찰 답변과 소감문은 개인 성장 기록지와 팜플렛에 실려요.</div></div></div>';

    h += '</section>';
    h += '<div class="submit-bar"><div class="inner">' +
      (f.editing ? '<button class="btn ghost" id="cancelEdit" type="button">취소</button>' : '') +
      '<span class="saved" id="saved">' + (f.savedAt ? '임시저장 ' + BUT_API.fmtTime(f.savedAt).split(' ')[1] : '') + '</span>' +
      '<button class="btn accent block" id="submitBtn" type="button">' + (f.editing ? '수정 내용 제출' : 'DAY ' + BUT_Program.pad2(d.day) + ' 기록 제출') + '</button></div></div>';
    return h;
  }

  function bindForm(d, f) {
    var add = document.getElementById('addPh');
    if (add) add.addEventListener('click', function () { $file.value = ''; $file.click(); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-rm]'), function (b) {
      b.addEventListener('click', function () { f.photos.splice(Number(b.dataset.rm), 1); renderMain(); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-cap]'), function (inp) {
      inp.addEventListener('input', function () { f.photos[Number(inp.dataset.cap)].caption = inp.value; });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-mis]'), function (sel) {
      sel.addEventListener('change', function () { f.photos[Number(sel.dataset.mis)].mission = sel.value; });
    });
    [['reflection', R.reflectionMin, R.reflectionMax], ['essay', R.essayMin, R.essayMax], ['oneLine', 0, R.oneLineMax]].forEach(function (cfg) {
      var el = document.getElementById(cfg[0]);
      el.addEventListener('input', function () {
        f[cfg[0]] = el.value;
        var len = charLen(el.value);
        var c = document.getElementById('c-' + cfg[0]);
        c.textContent = len + (cfg[1] ? ' / 최소 ' + cfg[1] : '') + ' · 최대 ' + cfg[2] + '자';
        c.classList.toggle('bad', (cfg[1] && len < cfg[1]) || len > cfg[2]);
        if (cfg[0] === 'oneLine') document.getElementById('pv-one').textContent = el.value || d.sampleOneLine;
        saveDraft(d.day);
      });
    });
    var cancel = document.getElementById('cancelEdit');
    if (cancel) cancel.addEventListener('click', function () { f.editing = false; f.photos = []; renderMain(); });
    document.getElementById('submitBtn').addEventListener('click', function () { submitDay(d.day); });
  }

  // ------------------------------------------------------------ 사진 처리
  function readAsDataURL(blob) {
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onload = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
      r.readAsDataURL(blob);
    });
  }
  function loadImage(file) {
    if (window.createImageBitmap) {
      return createImageBitmap(file, { imageOrientation: 'from-image' }).catch(function () { return loadViaImg(file); });
    }
    return loadViaImg(file);
  }
  function loadViaImg(file) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () { res(img); };
      img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('decode')); };
      img.src = url;
    });
  }
  function makeDisplay(file) {
    return loadImage(file).then(function (img) {
      var w = img.width, h = img.height;
      var k = Math.min(1, R.displayMaxEdge / Math.max(w, h));
      var cw = Math.round(w * k), ch = Math.round(h * k);
      var cv = document.createElement('canvas');
      cv.width = cw; cv.height = ch;
      var ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, cw, ch);
      ctx.drawImage(img, 0, 0, cw, ch);
      if (img.close) img.close();
      return { dataUrl: cv.toDataURL('image/jpeg', 0.86), width: cw, height: ch };
    });
  }

  $file.addEventListener('change', function () {
    var f = form(S.day);
    var files = Array.prototype.slice.call($file.files || []);
    var room = R.maxPhotos - f.photos.length;
    if (files.length > room) toast('사진은 최대 ' + R.maxPhotos + '장까지예요. 앞의 ' + room + '장만 추가했어요.');
    files = files.slice(0, room);
    var jobs = files.map(function (file) {
      if (file.size > R.maxOriginalBytes) { toast('20MB가 넘는 사진은 올릴 수 없어요: ' + file.name, 4000); return null; }
      return makeDisplay(file).then(function (disp) {
        f.photos.push({ file: file, preview: disp.dataUrl, display: disp, caption: '', mission: '', clientUploadId: BUT_API.uuid(), photoId: null });
      }).catch(function () {
        toast('이 사진 형식은 열 수 없어요(HEIC 등). 카메라 설정을 ‘호환성 우선(JPG)’으로 바꾸거나 다른 사진을 골라 주세요.', 5000);
      });
    }).filter(Boolean);
    Promise.all(jobs).then(function () { renderMain(); });
  });

  // ------------------------------------------------------------ 기존 제출물 불러오기(수정)
  function loadExisting(day) {
    showBusy('이전 기록을 불러오는 중…', 0);
    api('mySubmission', { token: S.token, day: day }).then(function (r) {
      var f = form(day);
      var sub = r.submission;
      if (!sub) { hideBusy(); f.editing = false; renderMain(); return; }
      f.reflection = sub.reflection; f.essay = sub.essay; f.oneLine = sub.oneLine;
      f.editing = true; f.clientSubmissionId = null;
      f.photos = [];
      return sub.photos.reduce(function (p, ph) {
        return p.then(function () {
          return api('myPhoto', { token: S.token, photoId: ph.photoId }).then(function (x) {
            f.photos.push({ photoId: ph.photoId, kept: true, preview: x.dataUrl, caption: ph.caption, mission: ph.mission });
          });
        });
      }, Promise.resolve()).then(function () { hideBusy(); renderMain(); });
    }).catch(function (e) { hideBusy(); handleError(e); });
  }

  // ------------------------------------------------------------ 제출
  var $busy = null;
  function showBusy(msg, pct) {
    if (!$busy) {
      $busy = document.createElement('div');
      $busy.className = 'overlay';
      $busy.innerHTML = '<div class="dialog" role="alertdialog" aria-live="assertive"><h3 id="busyMsg"></h3><div class="progress"><i id="busyBar"></i></div><p class="muted" style="font-size:13px;margin:0">화면을 끄거나 다른 앱으로 이동하지 마세요.</p></div>';
      document.body.appendChild($busy);
    }
    document.getElementById('busyMsg').textContent = msg;
    document.getElementById('busyBar').style.width = Math.round((pct || 0) * 100) + '%';
  }
  function hideBusy() { if ($busy) { $busy.remove(); $busy = null; } }

  function ask(title, body, okText) {
    return new Promise(function (resolve) {
      var o = document.createElement('div');
      o.className = 'overlay';
      o.innerHTML = '<div class="dialog" role="dialog" aria-modal="true"><h3>' + esc(title) + '</h3><p class="muted" style="margin:0">' + body + '</p>' +
        '<div class="actions"><button class="btn ghost" data-a="0">취소</button><button class="btn accent" data-a="1">' + esc(okText) + '</button></div></div>';
      document.body.appendChild(o);
      o.addEventListener('click', function (ev) {
        var a = ev.target.getAttribute && ev.target.getAttribute('data-a');
        if (a === null) return;
        o.remove();
        resolve(a === '1');
      });
    });
  }

  function showErrors(errs) {
    Array.prototype.forEach.call(document.querySelectorAll('[data-err]'), function (el) {
      var k = el.getAttribute('data-err');
      el.textContent = errs[k] || '';
      var fld = document.getElementById('f-' + k);
      if (fld) fld.classList.toggle('invalid', !!errs[k]);
    });
    var first = Object.keys(errs)[0];
    if (first) {
      var el = document.getElementById('f-' + first);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  function localValidate(f) {
    var e = {};
    var rl = charLen(f.reflection.trim()), el = charLen(f.essay.trim()), ol = charLen(f.oneLine.trim());
    if (f.photos.length < R.minPhotos) e.photos = '사진을 ' + R.minPhotos + '장 이상 올려 주세요.';
    if (rl < R.reflectionMin) e.reflection = '성찰 질문 답변을 ' + R.reflectionMin + '자 이상 써 주세요. (현재 ' + rl + '자)';
    if (rl > R.reflectionMax) e.reflection = R.reflectionMax + '자 이하로 줄여 주세요.';
    if (el < R.essayMin) e.essay = '소감문을 ' + R.essayMin + '자 이상 써 주세요. (현재 ' + el + '자)';
    if (el > R.essayMax) e.essay = R.essayMax + '자 이하로 줄여 주세요.';
    if (ol < 2) e.oneLine = '오늘을 표현하는 한 줄을 써 주세요.';
    if (ol > R.oneLineMax) e.oneLine = R.oneLineMax + '자 이하로 줄여 주세요. (현재 ' + ol + '자)';
    return e;
  }

  function uploadOne(f, p, i, n, day) {
    if (p.photoId) return Promise.resolve();
    showBusy('사진 올리는 중 (' + (i + 1) + '/' + n + ')', (i + 0.3) / (n + 1));
    return readAsDataURL(p.file).then(function (orig) {
      return api('uploadPhoto', {
        token: S.token, day: day, clientUploadId: p.clientUploadId,
        original: { base64: orig, mime: p.file.type || 'image/jpeg', name: p.file.name },
        display: { base64: p.display.dataUrl, width: p.display.width, height: p.display.height }
      }, { retries: 3 });
    }).then(function (r) { p.photoId = r.photoId; });
  }

  function submitDay(day) {
    if (S.busy) return;
    var f = form(day);
    var errs = localValidate(f);
    showErrors(errs);
    if (Object.keys(errs).length) return;
    S.busy = true;
    if (!f.clientSubmissionId) f.clientSubmissionId = BUT_API.uuid();
    var n = f.photos.length;
    var chain = Promise.resolve();
    f.photos.forEach(function (p, i) { chain = chain.then(function () { return uploadOne(f, p, i, n, day); }); });
    chain.then(function () {
      showBusy('기록 제출 중…', n / (n + 1));
      return send(false);
    }).catch(function (e) {
      hideBusy(); S.busy = false;
      if (e && e.extra && e.extra.fields) showErrors(e.extra.fields);
      handleError(e, '제출하지 못했어요. 다시 시도해 주세요.');
    });

    function send(confirmOverwrite) {
      return api('submit', {
        token: S.token, day: day, clientSubmissionId: f.clientSubmissionId, confirmOverwrite: confirmOverwrite,
        reflection: f.reflection, essay: f.essay, oneLine: f.oneLine, userAgent: navigator.userAgent,
        photos: f.photos.map(function (p) { return { photoId: p.photoId, caption: p.caption || '', mission: p.mission || '' }; })
      }, { retries: 3 }).then(function (r) {
        if (r.status === 'exists') {
          hideBusy();
          return ask('이미 제출한 기록이 있어요',
            'DAY ' + BUT_Program.pad2(day) + ' 기록을 ' + esc(BUT_API.fmtTime(r.existing.submittedAt)) + '에 제출했어요 (' + r.existing.revision + '회차).<br>지금 쓴 내용으로 <b>바꿔서</b> 제출할까요? 이전 기록은 선생님만 볼 수 있게 보관돼요.',
            '새 내용으로 바꾸기').then(function (ok) {
            if (!ok) { S.busy = false; return; }
            showBusy('기록 제출 중…', 0.9);
            return send(true);
          });
        }
        finish(r);
      });
    }

    function finish(r) {
      hideBusy(); S.busy = false;
      store.del(draftKey(day));
      S.forms[day] = null; delete S.forms[day];
      S.lastReceipt = r.receipt; S.lastReceipt.status = r.status;
      S.view = 'done';
      api('myStatus', { token: S.token }).then(function (x) { S.status = x.status; renderMain(); }).catch(function () {
        var s = stateOf(day); s.submitted = true; s.submittedAt = r.receipt.submittedAt; s.revision = r.receipt.revision; renderMain();
      });
      window.scrollTo(0, 0);
    }
  }

  function renderDone() {
    var r = S.lastReceipt;
    var next = PROG.days.filter(function (x) { return x.day > r.day && !stateOf(x.day).submitted && stateOf(x.day).state === 'open'; })[0];
    return '<section class="card done" id="doneCard"><div class="stamp">벗</div>' +
      '<h2>' + (r.status === 'updated' ? '수정 제출 완료!' : '제출 완료!') + '</h2>' +
      '<p class="muted" style="margin:6px 0 0">“' + esc(r.oneLine) + '”</p>' +
      '<div class="receipt"><div><span>날짜</span><b>DAY ' + BUT_Program.pad2(r.day) + '</b></div>' +
      '<div><span>제출 시각</span><b>' + esc(BUT_API.fmtTime(r.submittedAt)) + '</b></div>' +
      '<div><span>회차</span><b>' + r.revision + '회차' + (r.revision > 1 ? ' (최신 내용으로 교체됨)' : '') + '</b></div>' +
      '<div><span>사진</span><b>' + r.photoCount + '장</b></div>' +
      '<div><span>접수 번호</span><b style="font-size:12px">' + esc(r.submissionId) + '</b></div></div>' +
      '<div style="display:grid;gap:8px"><button class="btn ghost block" id="editAgain">내용 다시 수정하기</button>' +
      (next ? '<button class="btn block" id="nextDay" data-day="' + next.day + '">DAY ' + BUT_Program.pad2(next.day) + ' 미션 보기</button>' : '') + '</div></section>';
  }

  // ------------------------------------------------------------ 시작
  if (S.token && S.student) {
    $app.innerHTML = '<p class="muted">불러오는 중…</p>';
    api('myStatus', { token: S.token }).then(function (r) {
      S.status = r.status; S.student = r.student;
      S.day = pickDefaultDay(r.status, r.today);
      renderMain();
    }).catch(function (e) { if (e.code === 'AUTH') logout(true); else { renderLogin(e.message); } });
  } else {
    renderLogin();
  }

  window.addEventListener('beforeunload', function (ev) {
    if (S.busy) { ev.preventDefault(); ev.returnValue = ''; }
  });
})();

</script>
</body>
