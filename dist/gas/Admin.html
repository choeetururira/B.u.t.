<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>B.U.T. TOKYO 2026 · 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* B.U.T. TOKYO 2026 — 공통 화면 스타일 (학생 · 관리자) */
:root {
  --paper: #F5F0E6;
  --paper-deep: #EBE3D3;
  --card: #FBF8F2;
  --ink: #23303F;
  --ink-soft: #5B6573;
  --line: #CFCABC;
  --accent: #C2432F;
  --accent-soft: #F3DDD6;
  --indigo: #2F4A6D;
  --sage: #A9AE9A;
  --ok: #3F7A52;
  --ok-soft: #DDEBDF;
  --warn: #B7791F;
  --warn-soft: #F6E7C8;
  --day: #C2432F;
  --radius: 16px;
  --shadow: 0 1px 2px rgba(35, 48, 63, .06), 0 6px 20px rgba(35, 48, 63, .07);
  --font: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --font-body: 'Gowun Batang', 'AppleMyungjo', 'Batang', serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--indigo); }
h1, h2, h3 { margin: 0; line-height: 1.3; letter-spacing: -0.01em; }
.label {
  font-size: 11px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.muted { color: var(--ink-soft); }
.hidden { display: none !important; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 44px;
  padding: 10px 18px;
  border-radius: 999px;
  border: 1px solid var(--ink);
  background: var(--ink);
  color: #fff;
  font-weight: 700;
  transition: transform .08s ease, opacity .15s;
}
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.accent { background: var(--accent); border-color: var(--accent); }
.btn.small { min-height: 34px; padding: 6px 12px; font-size: 14px; }
.btn.block { width: 100%; }

.field { display: block; margin: 0 0 18px; }
.field > .field-label {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  font-weight: 700;
  margin-bottom: 6px;
}
.field .hint { font-size: 13px; color: var(--ink-soft); font-weight: 400; }
.input, .textarea, .select {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
  font-size: 16px; /* iOS 확대 방지 */
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.textarea { min-height: 140px; resize: vertical; font-family: var(--font-body); line-height: 1.7; }
.input:focus, .textarea:focus, .select:focus { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(35, 48, 63, .1); }
.field.invalid .input, .field.invalid .textarea { border-color: var(--accent); }
.err { color: var(--accent); font-size: 13px; margin-top: 6px; min-height: 0; }
.counter { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.counter.bad { color: var(--accent); }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border: 1px solid currentColor;
  border-radius: 999px;
  font-size: 12px;
  line-height: 1.5;
}
.badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.no { background: var(--paper-deep); color: var(--ink-soft); }
.badge.accent { background: var(--accent-soft); color: var(--accent); }

.stamp {
  display: inline-grid;
  place-items: center;
  width: 46px;
  height: 46px;
  border: 2px solid var(--accent);
  border-radius: 50%;
  color: var(--accent);
  font-weight: 700;
  font-size: 20px;
  transform: rotate(-8deg);
  box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 4px var(--accent);
  background: var(--paper);
  flex: none;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(20px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  background: var(--ink);
  color: #fff;
  padding: 12px 18px;
  border-radius: 12px;
  font-size: 14px;
  z-index: 100;
  max-width: calc(100vw - 32px);
  box-shadow: var(--shadow);
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(35, 48, 63, .5);
  display: grid;
  place-items: center;
  z-index: 90;
  padding: 16px;
}
.dialog {
  background: var(--card);
  border-radius: 20px;
  padding: 24px;
  width: min(420px, 100%);
  box-shadow: var(--shadow);
}
.dialog h3 { margin-bottom: 8px; }
.dialog .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
.progress { height: 8px; background: var(--paper-deep); border-radius: 99px; overflow: hidden; margin: 14px 0 6px; }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

body { background: var(--paper); }
.shell { max-width: 1280px; margin: 0 auto; padding: 0 20px 80px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 0; border-bottom: 1px solid var(--ink); margin-bottom: 18px; flex-wrap: wrap; }
.top h1 { font-size: 20px; }
.top .label { display: block; }
nav.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
nav.tabs button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 16px; font-weight: 700; }
nav.tabs button[aria-selected="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.panel { padding: 20px; margin-bottom: 18px; }
.panel h2 { font-size: 18px; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 18px; }
.stat { padding: 16px; }
.stat b { font-size: 28px; display: block; }
.bar { height: 6px; border-radius: 99px; background: var(--paper-deep); overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
th { font-size: 12px; letter-spacing: .06em; color: var(--ink-soft); font-weight: 700; background: var(--paper); position: sticky; top: 0; }
.cell { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 2px; border: 0; background: none; padding: 4px 6px; border-radius: 8px; text-align: left; }
.cell:hover { background: var(--paper); }
.cell small { color: var(--ink-soft); font-size: 11px; }
.table-wrap { overflow: auto; max-height: 70vh; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.filters .select, .filters .input { width: auto; min-width: 140px; padding: 8px 12px; }

.sub { display: grid; grid-template-columns: minmax(240px, 340px) 1fr; gap: 18px; padding: 18px; margin-bottom: 16px; }
@media (max-width: 860px) { .sub { grid-template-columns: 1fr; } }
.sub-photos { display: grid; gap: 10px; align-content: start; }
.sub-photo { position: relative; border-radius: 12px; overflow: hidden; background: var(--paper-deep); aspect-ratio: 4/3; }
.sub-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sub-photo .tools { position: absolute; left: 6px; right: 6px; bottom: 6px; display: flex; gap: 4px; flex-wrap: wrap; }
.sub-photo .tools button { border: 0; border-radius: 99px; padding: 4px 9px; font-size: 12px; background: rgba(255,255,255,.9); }
.sub-photo .tools button.on { background: var(--accent); color: #fff; }
.sub-photo .cap { position: absolute; top: 6px; left: 6px; right: 6px; font-size: 12px; background: rgba(35,48,63,.7); color: #fff; border-radius: 8px; padding: 2px 8px; }
.orig { font-size: 13px; color: var(--ink-soft); background: var(--paper); padding: 10px 12px; border-radius: 10px; white-space: pre-wrap; font-family: var(--font-body); margin-bottom: 6px; max-height: 160px; overflow: auto; }
details summary { cursor: pointer; font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
.topic-toggle { border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 4px 12px; font-size: 13px; }
.topic-toggle.on { color: #fff; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.seg button { border: 0; background: #fff; padding: 6px 12px; font-size: 13px; }
.seg button.on { background: var(--ink); color: #fff; }

.outputs { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.out { padding: 16px; display: grid; gap: 10px; align-content: start; }
.out h3 { font-size: 15px; }
.out .row .btn { flex: 1; }
.preview { background: #d9d3c7; border-radius: 14px; padding: 18px; display: grid; gap: 18px; justify-items: center; overflow: auto; max-height: 80vh; }
.preview .pg { box-shadow: 0 6px 24px rgba(0,0,0,.18); background: #fff; }
.preview .pg .but-page { transform-origin: 0 0; }
#print-root { display: none; }
@media print {
  body > *:not(#print-root) { display: none !important; }
  #print-root { display: block !important; }
  body { background: #fff; }
}
.login { max-width: 380px; margin: 12vh auto; padding: 28px; }
.mono { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
.kv { display: grid; grid-template-columns: 160px 1fr; gap: 8px 14px; font-size: 14px; }
.danger { border-color: var(--accent); }
</style>
<style id="print-style"></style>

<body>
<div class="shell" id="shell">
  <header class="top">
    <div><span class="label">B.U.T. TOKYO 2026 · 교사용</span><h1>기록 관리 · 결과물 제작</h1></div>
    <nav class="tabs hidden" id="tabs" role="tablist">
      <button data-tab="overview" aria-selected="true">제출 현황</button>
      <button data-tab="review">검토 · 편집</button>
      <button data-tab="students">학생 관리</button>
      <button data-tab="outputs">결과물 제작</button>
      <button data-tab="settings">설정</button>
      <button id="logoutBtn" class="btn ghost small">로그아웃</button>
    </nav>
  </header>
  <main id="view"></main>
</div>
<div id="print-root"></div>
<script>
//---------------------------------------------------------------------

//
// Copyright (c) 2009 Kazuhiko Arase
//

//  http://www.opensource.org/licenses/mit-license.php

// DENSO WAVE INCORPORATED

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {

  Page.prototype.toJSON = function () { return { bg: this.bg, els: this.els }; };

  function newDoc(name, sizeKey) {
    return { name: name, sizeKey: sizeKey, size: SIZES[sizeKey], pages: [] };
  }
  function finalize(doc) {
    return { name: doc.name, sizeKey: doc.sizeKey, size: doc.size, pages: doc.pages.map(function (p) { return p.toJSON(); }) };
  }

  // ------------------------------------------------------------ 데이터 헬퍼
  function byDay(ds, day) { return ds.entries.filter(function (e) { return e.day === day; }); }
  function photoIndex(ds) {
    var m = {};
    ds.entries.forEach(function (e) { e.photos.forEach(function (p) { m[p.id] = { photo: p, entry: e }; }); });
    return m;
  }
  function featured(e) {
    if (!e || !e.photos.length) return null;
    for (var i = 0; i < e.photos.length; i++) if (e.photos[i].id === e.featuredPhotoId) return e.photos[i];
    return e.photos[0];
  }
  function dayHero(ds, day) {
    var idx = photoIndex(ds);
    var h = ds.heroes && ds.heroes[day];
    if (h && idx[h] && idx[h].entry.day === day) return idx[h];
    var list = byDay(ds, day);
    for (var i = 0; i < list.length; i++) for (var j = 0; j < list[i].photos.length; j++) if (list[i].photos[j].exhibit) return { photo: list[i].photos[j], entry: list[i] };
    for (var k = 0; k < list.length; k++) if (featured(list[k])) return { photo: featured(list[k]), entry: list[k] };
    return null;
  }
  function sentences(text) {
    return String(text || '').replace(/\s+/g, ' ').split(/(?<=[.!?。~])\s+/).map(function (s) { return s.trim(); }).filter(Boolean);
  }
  function excerpt(text, keywords, max) {
    // 주제어가 들어간 문장(없으면 첫 문장)부터 max 글자 안에서 이어지는 문장을 함께 인용
    var ss = sentences(text);
    var start = -1;
    if (keywords) {
      for (var i = 0; i < ss.length && start < 0; i++) {
        for (var k = 0; k < keywords.length; k++) if (ss[i].indexOf(keywords[k]) >= 0 && Array.from(ss[i]).length >= 15) { start = i; break; }
      }
    }
    if (start < 0) for (var j = 0; j < ss.length && start < 0; j++) if (Array.from(ss[j]).length >= 15) start = j;
    if (start < 0) start = 0;
    var pick = ss[start] || '';
    for (var n = start + 1; n < ss.length; n++) {
      if (Array.from(pick + ' ' + ss[n]).length > max) break;
      pick += ' ' + ss[n];
    }
    var chars = Array.from(pick);
    if (chars.length > max) pick = chars.slice(0, max - 1).join('').replace(/\s+\S*$/, '') + '…';
    return pick;
  }
  function meta(e) {
    var d = P.getDay(e.day);
    return e.displayName + ' / ' + d.dateLabel;
  }
  function topicOf(key) {
    for (var i = 0; i < program.topics.length; i++) if (program.topics[i].key === key) return program.topics[i];
    return null;
  }

  // ------------------------------------------------------------ 공통 장식
  function frame(pg, W, H, inset, label, right) {
    pg.rect(inset, inset, W - inset * 2, H - inset * 2, { stroke: D.line, sw: 0.35 });
    return pg;
  }
  function stamp(pg, x, y, d, text, color, rot) {
    pg.ellipse(x, y, d, d, { fill: D.paper, stroke: color, sw: d * 0.03, rot: rot || 0 });
    pg.ellipse(x + d * 0.08, y + d * 0.08, d * 0.84, d * 0.84, { stroke: color, sw: d * 0.008, rot: rot || 0 });
    var n = Array.from(text).length;
    var pt = (d * (n > 1 ? 0.62 / n : 0.55)) / PT / 0.92;
    pg.text(x, y + d / 2 - (pt * PT * 1.1) / 2, d, pt * PT * 1.15, text, { pt: pt, color: color, bold: true, align: 'center', valign: 'middle', lh: 1.1, rot: rot || 0 });
  }
  function washi(pg, x, y, w, h, color, rot) {
    pg.rect(x, y, w, h, { fill: color, op: 0.55, rot: rot || 0 });
  }
  function decoLines(pg, x, y, w, gap, color) {
    pg.line(x, y, x + w, y, { color: color || D.line, sw: 0.5 });
    pg.line(x, y + gap, x + w, y + gap, { color: color || D.line, sw: 0.5 });
    pg.line(x, y + gap * 2, x + w * 0.62, y + gap * 2, { color: color || D.line, sw: 0.5 });
  }

  // 예시 이미지(Canva 카드)와 같은 구성의 기록 카드. 기준 크기 98×103mm, k배로 확대/축소
  function recordCard(pg, x, y, w, h, e, o) {
    o = o || {};
    var d = P.getDay(e.day);
    var k = h / 103;
    var pad = 6 * k;
    pg.rect(x, y, w, h, { fill: D.card, stroke: D.line, sw: 0.3 * k, r: 3.5 * k });
    pg.text(x + pad, y + 4.5 * k, w - pad * 2, 4.5 * k, program.brand, { pt: 9 * k, color: D.inkSoft, ls: 0.8 * k });
    if (o.showDay) pg.text(x + pad, y + 9.5 * k, w - pad * 2, 9 * k, P.dayLabel(e.day), { pt: 20 * k, bold: true, color: D.ink });
    var py = y + (o.showDay ? 20 : 11) * k;
    var ph = (o.showDay ? 47 : 52) * k;
    pg.img(x + pad, py, w - pad * 2, ph, featured(e), { r: 3.5 * k, label: '사진 비공개' });
    pg.text(x + pad, py + ph + 3.5 * k, w - pad * 2, 17 * k, e.oneLine, { pt: 17 * k, min: 11 * k, bold: true, lh: 1.32, maxLines: 2, color: D.ink });
    pg.text(x + pad, y + 86 * k, w - pad * 2, 5 * k, meta(e), { pt: 11 * k, color: D.inkSoft, ls: 0.4 * k });
    decoLines(pg, x + pad, y + 93.5 * k, w - pad * 2, 2.6 * k, D.line);
  }

  function topBar(pg, W, m, y, pt, right) {
    pg.text(m, y, W / 2, pt * PT * 1.4, program.brand, { pt: pt, color: D.ink, ls: pt * 0.15, bold: true });
    pg.text(W / 2, y, W / 2 - m, pt * PT * 1.4, right || program.brandFull.toUpperCase(), { pt: pt * 0.75, color: D.inkSoft, ls: pt * 0.12, align: 'right', valign: 'middle' });
    pg.line(m, y + pt * PT * 1.9, W - m, y + pt * PT * 1.9, { color: D.ink, sw: pt * 0.02 });
  }
  function footer(pg, W, H, m, left, right, pt) {
    var y = H - m - pt * PT * 1.5;
    pg.line(m, y - 3, W - m, y - 3, { color: D.line, sw: 0.4 });
    pg.text(m, y, W * 0.65, pt * PT * 1.5, left, { pt: pt, color: D.inkSoft });
    pg.text(W * 0.5, y, W * 0.5 - m, pt * PT * 1.5, right, { pt: pt, color: D.inkSoft, align: 'right' });
  }
  function chips(pg, x, y, maxW, items, pt, color) {
    var cx = x, h = pt * PT * 1.9;
    items.forEach(function (it) {
      var w = textWidth(it, pt, 0) + pt * PT * 1.8;
      if (cx + w > x + maxW) return;
      pg.rect(cx, y, w, h, { stroke: color, sw: pt * 0.012, r: h / 2 });
      pg.text(cx, y + (h - pt * PT * 1.3) / 2, w, pt * PT * 1.3, it, { pt: pt, color: color, align: 'center', lh: 1.25 });
      cx += w + pt * PT * 0.8;
    });
  }

    // 오른쪽 대표 사진

    pg.img(hx, hy, hw, hh, hero && hero.photo, { r: 6, label: 'DAY ' + P.pad2(day) });

    // 학생 기록 그리드
    var entries = byDay(ds, day);
    var gy = 356, gh = 436, gx = m, gw = W - m * 2;
    var cols = 5, gap = 8;
    var rows = Math.max(1, Math.ceil(entries.length / cols));
    if (rows > 4) { cols = 6; rows = Math.ceil(entries.length / cols); }
    var cw = (gw - gap * (cols - 1)) / cols;
    var ch = Math.min(103 * (cw / 98.8), (gh - gap * (rows - 1)) / rows);
    cw = Math.min(cw, ch * (98.8 / 103));
    var offX = gx + (gw - (cw * cols + gap * (cols - 1))) / 2;
    entries.forEach(function (e, i) {
      var c = i % cols, r = Math.floor(i / cols);
      recordCard(pg, offX + c * (cw + gap), gy + r * (ch + gap), cw, ch, e);
    });
    if (!entries.length) pg.text(gx, gy + 150, gw, 20, '아직 제출된 기록이 없습니다.', { pt: 36, color: D.sage, align: 'center' });

    footer(pg, W, H, m, program.schoolName + '  ·  ' + program.subtitle, 'DAY ' + P.pad2(day) + ' / 04  ·  학생 기록 ' + entries.length + '편', 15);
    return finalize(doc);
  }

  // ============================================================ 2. 주제별 A1 포스터
  function pickForTopic(ds, key, n) {
    var list = ds.entries.filter(function (e) { return e.topics.indexOf(key) >= 0; });
    list.sort(function (a, b) {
      var sa = (a.photos.some(function (p) { return p.exhibit; }) ? 4 : 0) + (a.reviewStatus === 'approved' ? 2 : 0) + (featured(a) ? 1 : 0) + Math.min(Array.from(a.essay).length / 1000, 1);
      var sb = (b.photos.some(function (p) { return p.exhibit; }) ? 4 : 0) + (b.reviewStatus === 'approved' ? 2 : 0) + (featured(b) ? 1 : 0) + Math.min(Array.from(b.essay).length / 1000, 1);
      return sb - sa;
    });
    // 학생이 겹치지 않도록 우선 선택
    var used = {}, out = [], rest = [];
    list.forEach(function (e) { if (!used[e.studentId]) { used[e.studentId] = 1; out.push(e); } else rest.push(e); });
    return { picked: out.concat(rest).slice(0, n), total: list.length, students: Object.keys(used).length };
  }

    sel.picked.slice(1, 10).forEach(function (e, i) {

  function recordCards(ds, day) {

  // ============================================================ 6. 접속 안내 (QR) + PIN 배부 카드
  function accessGuide(url, students) {
    var doc = newDoc('접속안내_QR_A4', 'A4');

    pg.text(m, 178, W - m * 2, 6, url, { pt: 7.5, color: D.inkSoft, align: 'center' });
    var steps = [
      ['1', '학생 번호와 PIN(4자리)으로 로그인'],
      ['2', '오늘 날짜(DAY)의 미션과 성찰 질문 확인'],
      ['3', '사진 1~3장, 성찰 답변, 소감문, 한 줄 기록 작성'],
      ['4', '제출 완료 화면 확인 — 다시 제출하면 최신 내용으로 바뀝니다']
    ];
    steps.forEach(function (st, i) {
      var y = 192 + i * 15;
      pg.ellipse(m, y, 10, 10, { fill: D.accent });
      pg.text(m, y + 2.3, 10, 5, st[0], { pt: 11, bold: true, color: '#FFFFFF', align: 'center' });
      pg.text(m + 14, y + 1.8, W - m * 2 - 14, 7, st[1], { pt: 11.5, color: D.ink });
    });
    pg.text(m, 258, W - m * 2, 14, '※ 사진과 글은 인솔 교사만 볼 수 있으며, 전시물에는 실명 대신 학생 표시 이름이 사용됩니다. 얼굴이 크게 나온 친구 사진은 동의를 받고 올려 주세요.', { pt: 8.5, color: D.inkSoft, lh: 1.5 });

    if (students && students.length) {
      var cols = 2, rows = 5, cw = (W - 20 - 6) / cols, ch = (H - 20 - 4 * 4) / rows;
      students.forEach(function (st, i) {
        if (i % (cols * rows) === 0) pg = new Page(doc, '#FFFFFF');
        var k = i % (cols * rows);
        var x = 10 + (k % cols) * (cw + 6), y = 10 + Math.floor(k / cols) * (ch + 4);
        pg.rect(x, y, cw, ch, { fill: D.paper, stroke: D.line, sw: 0.3, dash: true, r: 2 });
        pg.text(x + 6, y + 5, cw - 40, 5, program.brand, { pt: 7.5, bold: true, color: D.ink, ls: 0.8 });
        pg.text(x + 6, y + 12, cw - 40, 9, st.displayName, { pt: 16, bold: true, color: D.accent, maxLines: 1, min: 10 });
        pg.text(x + 6, y + 24, cw - 40, 6, '학생 번호   ' + st.studentId, { pt: 11, color: D.ink });
        pg.text(x + 6, y + 31, cw - 40, 6, 'PIN   ' + st.pin, { pt: 11, color: D.ink, bold: true });
        pg.text(x + 6, y + 40, cw - 40, 8, 'PIN은 다른 사람에게 알려주지 마세요.', { pt: 7, color: D.inkSoft });
        pg.qr(x + cw - 32, y + 8, 26, url);
      });
    }
    return finalize(doc);
  }

  function box(e) { return 'left:' + n(e.x) + 'mm;top:' + n(e.y) + 'mm;width:' + n(e.w) + 'mm;height:' + n(e.h) + 'mm;'; }

          'color:' + e.color + ';' + (e.bold ? 'font-weight:700;' : '') + (e.ls ? 'letter-spacing:' + n(e.ls) + 'pt;' : '') +

<script>
/*
 * 문서 모델 → PPTX (편집 가능한 원본: PowerPoint · Keynote · Google Slides · Canva 가져오기)
 * resolve(photoId) → 'data:image/jpeg;base64,...' | null
 * PptxGenJS: 브라우저는 전역 PptxGenJS, Node는 require('pptxgenjs')
 */
var BUT_RenderPPTX = (function () {
  var P = typeof BUT_Program !== 'undefined' ? BUT_Program : require('./program.js');
  var QR = typeof qrcode !== 'undefined' ? qrcode : (typeof require !== 'undefined' ? require('qrcode-generator') : null);
  var F = P.program.design.fonts;
  var IN = 1 / 25.4;
  function c(hex) { return String(hex || '#000000').replace('#', '').toUpperCase(); }
  function i(mm) { return Math.round(mm * IN * 10000) / 10000; }
  function pt(mm) { return Math.round((mm / 0.3528) * 100) / 100; }

  function qrRects(slide, pptx, e) {
    if (!QR) return;
    var q = QR(0, 'M');
    q.addData(String(e.data));
    q.make();
    var count = q.getModuleCount();
    var cell = e.w / count;
    for (var r = 0; r < count; r++) {
      var run = -1;
      for (var col = 0; col <= count; col++) {
        var dark = col < count && q.isDark(r, col);
        if (dark && run < 0) run = col;
        if (!dark && run >= 0) {
          slide.addShape(pptx.ShapeType.rect, { x: i(e.x + run * cell), y: i(e.y + r * cell), w: i((col - run) * cell), h: i(cell), fill: { color: '000000' }, line: { type: 'none' } });
          run = -1;
        }
      }
    }
  }

  function render(doc, resolve, PptxGenJS) {
    var Ctor = PptxGenJS || (typeof window !== 'undefined' && window.PptxGenJS) || require('pptxgenjs');
    var pptx = new Ctor();
    var layoutName = 'BUT_' + doc.sizeKey;
    pptx.defineLayout({ name: layoutName, width: i(doc.size.w), height: i(doc.size.h) });
    pptx.layout = layoutName;
    pptx.title = doc.name;
    pptx.company = P.program.schoolName;
    pptx.subject = P.program.brand;

    doc.pages.forEach(function (page) {
      var slide = pptx.addSlide();
      slide.background = { color: c(page.bg) };
      page.els.forEach(function (e) {
        switch (e.t) {
          case 'rect':
          case 'ellipse': {
            var o = { x: i(e.x), y: i(e.y), w: i(e.w), h: i(e.h), rotate: e.rot || 0 };
            if (e.fill) o.fill = { color: c(e.fill), transparency: Math.round((1 - (e.op === undefined ? 1 : e.op)) * 100) };
            o.line = e.stroke && e.sw ? { color: c(e.stroke), width: pt(e.sw) } : { type: 'none' };
            var shape = e.t === 'ellipse' ? pptx.ShapeType.ellipse : e.r ? pptx.ShapeType.roundRect : pptx.ShapeType.rect;

          }
          case 'line': {
            slide.addShape(pptx.ShapeType.line, {

              w: i(Math.abs(e.x2 - e.x1)), h: i(Math.abs(e.y2 - e.y1)),
              line: { color: c(e.color), width: pt(e.sw), dashType: e.dash ? 'dash' : 'solid' }
            });
            break;
          }
          case 'text': {
            slide.addText(e.text, {
              x: i(e.x), y: i(e.y), w: i(e.w), h: i(e.h), margin: 0,
              fontFace: e.font === 'body' ? F.body : F.title, fontSize: e.pt, bold: !!e.bold,
              color: c(e.color), align: e.align, valign: e.valign === 'middle' ? 'middle' : e.valign === 'bottom' ? 'bottom' : 'top',
              lineSpacing: Math.round(e.pt * e.lh * 100) / 100, charSpacing: e.ls || 0, rotate: e.rot || 0,
              fit: 'none', wrap: true, lang: 'ko-KR'
            });
            break;
          }
          case 'img': {
            var src = resolve ? resolve(e.src) : null;
            if (!src) {
              slide.addShape(pptx.ShapeType.rect, { x: i(e.x), y: i(e.y), w: i(e.w), h: i(e.h), fill: { color: c(P.program.design.paperDeep) }, line: { type: 'none' } });
              break;
            }
            var data = src.replace(/^data:/, '');
            slide.addImage({
              data: data, x: i(e.x), y: i(e.y), w: i(e.w), h: i((e.w * e.ih) / e.iw),
              sizing: { type: 'cover', w: i(e.w), h: i(e.h) }

            break;
          }
          case 'qr':
            qrRects(slide, pptx, e);
            break;
        }
      });
    });
    return pptx;
  }

  return { render: render };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = BUT_RenderPPTX;

<script>
/*
 * 서버 호출 어댑터: Apps Script에서는 google.script.run, 로컬 서버에서는 fetch('/api')
 * 네트워크 오류는 자동 재시도, 서버가 돌려준 오류(검증 실패 등)는 그대로 전달
 */
var BUT_API = (function () {
  var isGAS = typeof google !== 'undefined' && google.script && google.script.run;

  function once(action, payload) {
    return new Promise(function (resolve, reject) {
      if (isGAS) {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(function (err) { reject({ network: true, message: String(err && err.message || err) }); })
          .api(action, payload);
      } else {
        fetch('api', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: action, payload: payload }) })
          .then(function (r) { if (!r.ok && r.status >= 500) throw new Error('HTTP ' + r.status); return r.json(); })
          .then(resolve)
          .catch(function (e) { reject({ network: true, message: String(e && e.message || e) }); });
      }
    });
  }

  function call(action, payload, opts) {
    opts = opts || {};
    var tries = opts.retries === undefined ? 2 : opts.retries;
    function attempt(n) {
      return once(action, payload).then(function (res) {
        if (res && res.ok) return res.data;
        var err = (res && res.error) || { code: 'SERVER', message: '알 수 없는 오류' };
        throw err;
      }, function (netErr) {
        if (n < tries) return new Promise(function (r) { setTimeout(r, 1200 * Math.pow(2, n)); }).then(function () { return attempt(n + 1); });
        throw { code: 'NETWORK', message: '인터넷 연결이 불안정합니다. 와이파이/데이터를 확인하고 다시 시도해 주세요.', detail: netErr.message };
      });
    }
    return attempt(0);
  }

  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = (Math.random() * 16) | 0;
      return (c === 'x' ? r : (r & 0x3) | 0x8).toString(16);
    });
  }

  var store = {
    get: function (k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 저장 불가(사생활 보호 모드) */ } },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) { /* 무시 */ } }
  };

  function toast(msg, ms) {
    var t = document.createElement('div');
    t.className = 'toast';
    t.setAttribute('role', 'status');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, ms || 2600);
  }

  function esc(s) {
    return String(s === undefined || s === null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

    if (!isoStr) return '';

  }

  function editField(s, key, label, type) {

    root.querySelector('[data-save]').addEventListener('click', function () {
      var patch = { reviewStatus: state.reviewStatus, teacherNote: root.querySelector('[data-k="teacherNote"]').value };
      ['oneLine', 'reflection', 'essay'].forEach(function (k) {
        var v = root.querySelector('[data-k="' + k + '"]').value.trim();
        var cap = 'edited' + k.charAt(0).toUpperCase() + k.slice(1);

      });

      msg.textContent = '저장 중…';

        Object.keys(r.submission).forEach(function (k) { s[k] = r.submission[k]; });

      });

          toast(heroes[s.day] ? 'DAY ' + pad2(s.day) + ' 포스터 대표 사진으로 지정했습니다.' : '대표 사진 지정을 해제했습니다.');
        }).catch(fail);

    });
    root.querySelectorAll('[data-orig]').forEach(function (b) {
      b.addEventListener('click', function () {

          var url = r.photos[b.dataset.orig];
          if (!url) return;
          var blob = dataUrlToBlob(url);

          if (w) w.location.href = obj; else window.open(obj, '_blank');
        }).catch(function (e) { if (w) w.close(); fail(e); });
      });
    });
  }

  function dataUrlToBlob(dataUrl) {
    var parts = dataUrl.split(',');
    var mime = parts[0].replace(/^data:|;base64$/g, '');
    var bin = atob(parts[1]);
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }

          return '<div class="card out" data-out="' + o.key + '"><span class="label">' + (o.key.indexOf('day') === 0 || o.key.indexOf('topic') === 0 ? 'A1 POSTER' : o.key === 'growth' || o.key === 'guide' ? 'A4' : o.key === 'pamphlet-a4' ? 'A4 BOOKLET' : 'A5') + '</span><h3>' + esc(o.label) + '</h3>' +
            '<div class="row"><button class="btn small" data-act="preview">미리보기</button><button class="btn ghost small" data-act="print">PDF 인쇄</button></div>' +
            '<div class="row"><button class="btn ghost small" data-act="pptx">PPTX</button><button class="btn ghost small" data-act="html">HTML</button>' + (BUT_API.isGAS ? '<button class="btn ghost small" data-act="drive">Drive 저장</button>' : '') + '</div></div>';
        }).join('') + '</div>' +
        '<div class="row" style="margin-top:14px"><button class="btn ghost small" id="csv">Canva 대량 제작용 CSV</button><button class="btn ghost small" id="json">데이터 백업(JSON)</button></div></section>' +
        '<section class="card panel hidden" id="pvPanel"><h2 id="pvTitle">미리보기</h2><div class="preview" id="pv"></div></section>';
      $view.innerHTML = h;
      api('adminStudents').then(function (r) {
        A.students = r.students;
        var sel = document.getElementById('growthWho');
        sel.innerHTML += r.students.map(function (s) { return '<option value="' + esc(s.studentId) + '">' + esc(s.studentId + ' · ' + s.displayName) + '</option>'; }).join('');
      });
      document.querySelectorAll('[data-out]').forEach(function (card) {
        card.querySelectorAll('[data-act]').forEach(function (b) {
          b.addEventListener('click', function () { runOutput(card.dataset.out, b.dataset.act, b); });
        });
      });
      document.getElementById('csv').addEventListener('click', exportCSV);
      document.getElementById('json').addEventListener('click', function () {
        dataset().then(function (ds) { download(new Blob([JSON.stringify(ds, null, 2)], { type: 'application/json' }), 'BUT_TOKYO_2026_데이터.json'); }).catch(fail);
      });
    }).catch(fail);
  }

  function dataset() {
    return api('adminDataset', { approvedOnly: document.getElementById('approvedOnly') && document.getElementById('approvedOnly').checked });
  }

  function buildDoc(key) {
    if (key === 'guide') {
      var url = document.getElementById('appUrl').value.trim() || location.href.split('?')[0];
      var stu = (A.students || []).filter(function (s) { return s.active; }).map(function (s) { return { studentId: s.studentId, displayName: s.displayName, pin: s.pin }; });
      return Promise.resolve({ doc: L.accessGuide(url, stu), key: key });
    }
    return dataset().then(function (ds) {
      var who = document.getElementById('growthWho').value;
      var doc = L.build(key, ds, { studentIds: who ? [who] : null });
      if (key === 'growth' && who) doc.name += '_' + who;
      return { doc: doc, key: key };
    });
  }

  function withPhotos(doc, key) {
    var ids = L.photoIdsOf(doc);
    var max = photoMax(key);
    return loadPhotos(ids).then(function () {
      return Promise.all(ids.map(function (id) { return scaled(id, max); }));
    }).then(function () {
      return function (id) { return A.photos[id + '@' + max] || A.photos[id] || null; };
    });
  }

  function runOutput(key, act, btn) {
    var label = btn.textContent;
    btn.disabled = true; btn.textContent = '준비 중…';
    var done = function () { btn.disabled = false; btn.textContent = label; };
    buildDoc(key).then(function (b) {
      return withPhotos(b.doc, key).then(function (resolve) {
        if (act === 'preview') return preview(b.doc, resolve);
        if (act === 'print') return printDoc(b.doc, resolve);
        if (act === 'html') return download(new Blob([RH.documentHTML(b.doc, resolve)], { type: 'text/html' }), b.doc.name + '.html');
        var pptx = RP.render(b.doc, resolve, window.PptxGenJS);
        if (act === 'pptx') return pptx.write({ outputType: 'blob' }).then(function (blob) { download(blob, b.doc.name + '.pptx'); });
        if (act === 'drive') {
          return pptx.write({ outputType: 'base64' }).then(function (b64) {
            return api('adminSaveOutput', { name: b.doc.name + '.pptx', mime: 'application/vnd.openxmlformats-officedocument.presentationml.presentation', base64: b64 }, { retries: 1 });
          }).then(function (r) { toast('Drive에 저장했습니다.'); if (r.url) window.open(r.url, '_blank'); });
        }
      });
    }).then(done).catch(function (e) { done(); fail(e); });
  }

  function preview(doc, resolve) {
    var panel = document.getElementById('pvPanel');
    panel.classList.remove('hidden');
    document.getElementById('pvTitle').innerHTML = esc(doc.name) + ' <span class="muted" style="font-size:13px;font-weight:400">' + doc.pages.length + '쪽 · ' + doc.sizeKey + ' (' + doc.size.w + '×' + doc.size.h + 'mm)</span>';
    var pv = document.getElementById('pv');
    var styleId = 'pv-style';
    var st = document.getElementById(styleId) || document.head.appendChild(Object.assign(document.createElement('style'), { id: styleId }));
    st.textContent = RH.css(doc).replace(/@page[^}]*}/, '');
    var maxW = Math.min(pv.clientWidth - 36, doc.sizeKey === 'A1' ? 760 : 560);
    var pxW = doc.size.w * 3.7795;
    var k = maxW / pxW;
    var limit = 12;
    function draw(n) {
      pv.innerHTML = doc.pages.slice(0, n).map(function (p) {
        return '<div class="pg" style="width:' + Math.round(pxW * k) + 'px;height:' + Math.round(doc.size.h * 3.7795 * k) + 'px;overflow:hidden">' +
          RH.pageHTML(doc, p, resolve).replace('<section class="but-page" style="', '<section class="but-page" style="transform:scale(' + k + ');') + '</div>';
      }).join('') + (doc.pages.length > n ? '<button class="btn" id="more">나머지 ' + (doc.pages.length - n) + '쪽 더 보기</button>' : '');
      var more = document.getElementById('more');
      if (more) more.addEventListener('click', function () { draw(doc.pages.length); });
    }
    draw(limit);
    panel.scrollIntoView({ behavior: 'smooth' });
  }

  function printDoc(doc, resolve) {
    var root = document.getElementById('print-root');
    document.getElementById('print-style').textContent = RH.css(doc);
    root.innerHTML = RH.pagesHTML(doc, resolve);
    var imgs = Array.prototype.slice.call(root.querySelectorAll('img'));
    return Promise.all(imgs.map(function (im) { return im.complete ? null : new Promise(function (r) { im.onload = im.onerror = r; }); }))
      .then(function () { return document.fonts ? document.fonts.ready : null; })
      .then(function () {
        toast('인쇄 창에서 ‘PDF로 저장’, 용지 ' + doc.sizeKey + ', 여백 ‘없음’, ‘배경 그래픽’을 선택하세요.', 6000);
        setTimeout(function () {
          window.print();
          setTimeout(function () { root.innerHTML = ''; document.getElementById('print-style').textContent = ''; }, 1500);
        }, 300);
      });
  }

  function download(blob, name) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  }

  function exportCSV() {
    dataset().then(function (ds) {
      var head = ['student_label', 'student_id', 'day', 'day_label', 'date', 'theme', 'one_line', 'reflection', 'essay', 'photo1_file', 'photo2_file', 'photo3_file'];
      var rows = ds.entries.map(function (e) {
        var d = BUT_Program.getDay(e.day);
        var files = e.photos.map(function (p) { return e.studentId + '_D' + e.day + '_' + p.id + '_print.jpg'; });
        return [e.displayName, e.studentId, e.day, 'DAY ' + pad2(e.day), d.dateLabel, d.theme, e.oneLine, e.reflection, e.essay, files[0] || '', files[1] || '', files[2] || ''];
      });
      var csv = '﻿' + [head].concat(rows).map(function (r) { return r.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(','); }).join('\r\n');
      download(new Blob([csv], { type: 'text/csv;charset=utf-8' }), 'BUT_TOKYO_2026_Canva_대량제작.csv');
    }).catch(fail);
  }

  // ============================================================ 설정
  function viewSettings() {
    api('adminSettings').then(function (st) {
      A.settings = st;
      var h = '<section class="card panel"><h2>제출 기간 · 마감</h2>' +
        '<div class="kv"><span>제출 가능 날짜</span><select class="select" id="openMode" style="max-width:360px"><option value="all"' + (st.openMode === 'all' ? ' selected' : '') + '>모든 DAY 항상 제출 가능 (테스트·사후 제출)</option><option value="byDate"' + (st.openMode === 'byDate' ? ' selected' : '') + '>해당 날짜(도쿄 시각)부터 제출 가능</option></select>' +
        PROG.days.map(function (d) { return '<span>DAY ' + pad2(d.day) + ' 마감</span><label class="row" style="gap:6px"><input type="checkbox" data-lock="' + d.day + '"' + (st.locks[d.day] ? ' checked' : '') + '> 제출 마감 (학생 수정 불가, 교사 편집은 가능)</label>'; }).join('') +
        '</div><div class="row" style="margin-top:14px"><button class="btn" id="saveSet">저장</button></div></section>';
      h += '<section class="card panel"><h2>학생 접속 주소</h2><div class="kv"><span>주소</span><span class="mono">' + esc(st.appUrl || '(배포 후 표시)') + '</span><span>관리자 주소</span><span class="mono">' + esc((st.appUrl || '') + '?page=admin') + '</span></div>' +
        (st.appUrl ? '<div style="width:160px;margin-top:12px">' + RH.qrSvg(st.appUrl) + '</div>' : '') + '</section>';
      h += '<section class="card panel danger"><h2 style="color:var(--accent)">가상(테스트) 데이터 삭제</h2><p class="muted" style="font-size:14px;margin-top:-4px">실제 학생 사용 전에 테스트 제출물·사진을 모두 지웁니다. 사진 파일은 Drive 휴지통으로 이동합니다(30일 후 영구 삭제).</p>' +
        '<label class="row" style="gap:6px;margin-bottom:10px"><input type="checkbox" id="purgeStudents"> 학생 명단과 PIN도 삭제 (새로 생성 필요)</label>' +
        '<div class="row"><input class="input" id="purgeConfirm" placeholder="DELETE 입력" style="max-width:180px"><button class="btn accent" id="purge">모두 삭제</button></div></section>';
      $view.innerHTML = h;
      document.getElementById('saveSet').addEventListener('click', function () {
        var locks = {};
        document.querySelectorAll('[data-lock]').forEach(function (c) { locks[c.dataset.lock] = c.checked; });
        api('adminSettings', { set: { openMode: document.getElementById('openMode').value, locks: locks } }).then(function () { toast('저장했습니다.'); }).catch(fail);
      });
      document.getElementById('purge').addEventListener('click', function () {
        var c = document.getElementById('purgeConfirm').value.trim();
        if (c !== 'DELETE') { toast('확인 문구로 DELETE를 입력하세요.'); return; }
        if (!confirm('정말 모든 제출물과 사진을 삭제할까요? 되돌릴 수 없습니다.')) return;
        api('adminPurge', { confirm: 'DELETE', students: document.getElementById('purgeStudents').checked }).then(function (r) {
          toast('삭제 완료: 사진 ' + r.deletedPhotos + '장');
          show('overview');
        }).catch(fail);
      });
    }).catch(fail);
  }

  if (A.token) start(); else renderLogin();
})();

</script>
